# Source census (prototype v0). One record per SOURCE element (source.xml mxCell),
# not per model.yaml element -- this is what makes the 4-bucket census machine-checkable
# instead of a hand-maintained claim: tools/rules-lint.mjs's CENSUS_MISMATCH check parses
# `source` below and asserts len(records) == vertex_count + edge_count, that every
# component/relationship target_id resolves into `model`, and that every drop carries a
# reason. A record's bucket is EXCLUSIVE (primary_bucket); `target_ids` is a list because
# one source element can trace to more than one downstream artifact (source_id 34 below is
# the padlock pass-through hop that feeds two model relationships).
kind: census
model: model.yaml
source: source.xml
records:
