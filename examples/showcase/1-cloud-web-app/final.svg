<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1020 780" width="1020" height="780" font-family="Arial, Helvetica, sans-serif">
<!--
  Semantic palette (C1). Every colored element (box border/fill/text, and every
  connector + its label) draws from exactly these six domains. An arrow is
  colored by the domain of the component it leads INTO (C2). Neutral grey is
  reserved for the legend caption only (C3) — no arrow or box falls back to it.

  domain     | meaning                                   | border  | fill(bg) | text    | light-on-dark
  actor      | human/external initiator (User)            | #3B4657 | #EDF0F3  | #24303D | #FFFFFF
  ingress    | DNS + CDN edge network entry (Route53,CDN)| #6B46C1 | #F1ECFB  | #452F82 | #FFFFFF
  routing    | load balancers (traffic distribution)      | #B7791F | #FBF1DC  | #7A5010 | #FFFFFF
  compute    | autoscaling groups + instances (execution)| #C2410C | #FCEBE0  | #8A2F09 | #FFFFFF
  storage    | object storage + static content (durable) | #15803D | #E7F6EC  | #0F5C2E | #FFFFFF
  database   | RDS master/slave (structured persistence) | #1D4ED8 | #E7EDFC  | #15359E | #FFFFFF
  neutral    | legend meta captions only (C3 fallback, no diagram meaning) | —       | —        | #4B5563 | —
-->
<defs>
  <marker id="arrow-actor" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#3B4657"/>
  </marker>
  <marker id="arrow-ingress" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#6B46C1"/>
  </marker>
  <marker id="arrow-routing" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#B7791F"/>
  </marker>
  <marker id="arrow-compute" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#C2410C"/>
  </marker>
  <marker id="arrow-storage" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#15803D"/>
  </marker>
  <marker id="arrow-database" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#1D4ED8"/>
  </marker>
</defs>

<rect x="-10" y="-10" width="1020" height="780" fill="#FFFFFF"/>

<!-- ============ CONTAINERS (drawn first, behind everything else) ============ -->
<!-- height = top-pad(30) + child-height(60) + bottom-pad(30) = 120, equal margins both axes (B9) -->
<rect x="220" y="240" width="740" height="120" rx="8" fill="#FCEBE0" stroke="#C2410C" stroke-width="2.5" stroke-dasharray="7 5"/>
<!-- title sits above the web-elb->instances fan-out bus (y=220), not just above the container border, so no riser at any x can strike it -->
<text x="228" y="214" font-size="13" font-weight="600" fill="#8A2F09">Web Tier Autoscaling Group (&#215;2 AZ)</text>

<rect x="220" y="500" width="740" height="120" rx="8" fill="#FCEBE0" stroke="#C2410C" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="228" y="474" font-size="13" font-weight="600" fill="#8A2F09">App Tier Autoscaling Group (&#215;2 AZ)</text>

<!-- ============ CONNECTORS ============ -->
<g fill="none" stroke-width="1.5">
  <!-- user -> route53 (straight, same row) -->
  <polyline points="420,70 460,70" stroke="#6B46C1" marker-end="url(#arrow-ingress)"/>

  <!-- user -> cdn (offset exit, elbow down-left) -->
  <polyline points="320,100 320,120 110,120 110,140" stroke="#6B46C1" marker-end="url(#arrow-ingress)"/>

  <!-- user -> web-elb (offset exit, elbow down-right) -->
  <polyline points="380,100 380,120 590,120 590,140" stroke="#B7791F" marker-end="url(#arrow-routing)"/>

  <!-- cdn -> static-assets -->
  <polyline points="110,200 110,240" stroke="#15803D" marker-end="url(#arrow-storage)"/>

  <!-- static-assets -> s3 -->
  <polyline points="110,300 110,340" stroke="#15803D" marker-end="url(#arrow-storage)"/>

  <!-- web-elb -> web-instance-{1..4} (diverging fan-out bus, separate arrowheads) -->
  <polyline points="590,200 590,220 320,220 320,270" stroke="#C2410C" marker-end="url(#arrow-compute)"/>
  <polyline points="590,200 590,220 500,220 500,270" stroke="#C2410C" marker-end="url(#arrow-compute)"/>
  <polyline points="590,200 590,220 680,220 680,270" stroke="#C2410C" marker-end="url(#arrow-compute)"/>
  <polyline points="590,200 590,220 860,220 860,270" stroke="#C2410C" marker-end="url(#arrow-compute)"/>

  <!-- web-instance-{1..4} -> app-elb (CONVERGING: risers + one merged trunk, one arrowhead, rule 11).
       Merge bus sits at y=380, centered in the 360-400 gap: 20px clear of the container's
       bottom border above and 20px clear of app-elb below (rule 6 - don't hug either box). -->
  <polyline points="320,330 320,380" stroke="#B7791F"/>
  <polyline points="500,330 500,380" stroke="#B7791F"/>
  <polyline points="680,330 680,380" stroke="#B7791F"/>
  <polyline points="860,330 860,380" stroke="#B7791F"/>
  <polyline points="860,380 320,380" stroke="#B7791F"/>
  <polyline points="590,380 590,400" stroke="#B7791F" marker-end="url(#arrow-routing)"/>

  <!-- app-elb -> app-instance-{1..4} (diverging fan-out bus) -->
  <polyline points="590,460 590,480 320,480 320,530" stroke="#C2410C" marker-end="url(#arrow-compute)"/>
  <polyline points="590,460 590,480 500,480 500,530" stroke="#C2410C" marker-end="url(#arrow-compute)"/>
  <polyline points="590,460 590,480 680,480 680,530" stroke="#C2410C" marker-end="url(#arrow-compute)"/>
  <polyline points="590,460 590,480 860,480 860,530" stroke="#C2410C" marker-end="url(#arrow-compute)"/>

  <!-- app-instance-{1..4} -> rds-master (CONVERGING: risers + one merged trunk, one arrowhead).
       Merge bus at y=640, centered in the 620-660 gap for the same reason as above. -->
  <polyline points="320,590 320,640" stroke="#1D4ED8"/>
  <polyline points="500,590 500,640" stroke="#1D4ED8"/>
  <polyline points="680,590 680,640" stroke="#1D4ED8"/>
  <polyline points="860,590 860,640" stroke="#1D4ED8"/>
  <polyline points="860,640 320,640" stroke="#1D4ED8"/>
  <polyline points="500,640 500,660" stroke="#1D4ED8" marker-end="url(#arrow-database)"/>

  <!-- rds-master -> rds-slave (replication: dashed carries real meaning, rule 10) -->
  <polyline points="570,690 610,690" stroke="#1D4ED8" stroke-dasharray="6 4" marker-end="url(#arrow-database)"/>
</g>

<!-- edge label: Cross-AZ Replication. The row-gap above (y620-660) already carries the
     app-instance->rds-master merge bus (y=640), so the label goes clear of BOTH boxes
     and that bus in the open canvas to the right of rds-slave instead (rule 12 / B5). -->
<text x="765" y="694" font-size="11" fill="#15359E">Cross-AZ Replication</text>

<!-- ============ LEAF BOXES (title-only, centered per T3) ============ -->
<!-- uniform 140x60, border-width 2.5, rx 6 (B1/B4) -->

<g font-size="13" text-anchor="middle">
  <!-- actor -->
  <rect x="280" y="40" width="140" height="60" rx="6" fill="#EDF0F3" stroke="#3B4657" stroke-width="2.5"/>
  <text x="350" y="75" fill="#24303D">User</text>

  <!-- ingress -->
  <rect x="460" y="40" width="140" height="60" rx="6" fill="#F1ECFB" stroke="#6B46C1" stroke-width="2.5"/>
  <text x="530" y="75" fill="#452F82">Amazon Route 53</text>

  <rect x="40" y="140" width="140" height="60" rx="6" fill="#F1ECFB" stroke="#6B46C1" stroke-width="2.5"/>
  <text x="110" y="175" fill="#452F82">CloudFront</text>

  <!-- routing -->
  <rect x="520" y="140" width="140" height="60" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="2.5"/>
  <text x="590" y="175" fill="#7A5010">Web ELB</text>

  <rect x="520" y="400" width="140" height="60" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="2.5"/>
  <text x="590" y="435" fill="#7A5010">App ELB</text>

  <!-- storage -->
  <rect x="40" y="240" width="140" height="60" rx="6" fill="#E7F6EC" stroke="#15803D" stroke-width="2.5"/>
  <text x="110" y="275" fill="#0F5C2E">Static Assets</text>

  <rect x="40" y="340" width="140" height="60" rx="6" fill="#E7F6EC" stroke="#15803D" stroke-width="2.5"/>
  <text x="110" y="375" fill="#0F5C2E">Amazon S3</text>

  <!-- compute: web-tier instances -->
  <rect x="250" y="270" width="140" height="60" rx="6" fill="#FCEBE0" stroke="#C2410C" stroke-width="2.5"/>
  <text x="320" y="305" fill="#8A2F09">Web 1</text>
  <rect x="430" y="270" width="140" height="60" rx="6" fill="#FCEBE0" stroke="#C2410C" stroke-width="2.5"/>
  <text x="500" y="305" fill="#8A2F09">Web 2</text>
  <rect x="610" y="270" width="140" height="60" rx="6" fill="#FCEBE0" stroke="#C2410C" stroke-width="2.5"/>
  <text x="680" y="305" fill="#8A2F09">Web 3</text>
  <rect x="790" y="270" width="140" height="60" rx="6" fill="#FCEBE0" stroke="#C2410C" stroke-width="2.5"/>
  <text x="860" y="305" fill="#8A2F09">Web 4</text>

  <!-- compute: app-tier instances -->
  <rect x="250" y="530" width="140" height="60" rx="6" fill="#FCEBE0" stroke="#C2410C" stroke-width="2.5"/>
  <text x="320" y="565" fill="#8A2F09">App 1</text>
  <rect x="430" y="530" width="140" height="60" rx="6" fill="#FCEBE0" stroke="#C2410C" stroke-width="2.5"/>
  <text x="500" y="565" fill="#8A2F09">App 2</text>
  <rect x="610" y="530" width="140" height="60" rx="6" fill="#FCEBE0" stroke="#C2410C" stroke-width="2.5"/>
  <text x="680" y="565" fill="#8A2F09">App 3</text>
  <rect x="790" y="530" width="140" height="60" rx="6" fill="#FCEBE0" stroke="#C2410C" stroke-width="2.5"/>
  <text x="860" y="565" fill="#8A2F09">App 4</text>

  <!-- database -->
  <rect x="430" y="660" width="140" height="60" rx="6" fill="#E7EDFC" stroke="#1D4ED8" stroke-width="2.5"/>
  <text x="500" y="695" fill="#15359E">RDS Master</text>
  <rect x="610" y="660" width="140" height="60" rx="6" fill="#E7EDFC" stroke="#1D4ED8" stroke-width="2.5"/>
  <text x="680" y="695" fill="#15359E">RDS Slave</text>
</g>

<!-- edge label: DNS lookup (short horizontal run, label placed above so the line never strikes it) -->
<text x="440" y="30" font-size="10" fill="#452F82" text-anchor="middle">DNS lookup</text>

<!-- ============ LEGEND (empty canvas region, top-right; not struck by any box/line) ============ -->
<g font-size="11">
  <text x="700" y="24" font-size="12" font-weight="600" fill="#4B5563">Legend</text>

  <rect x="700" y="34" width="14" height="14" rx="3" fill="#EDF0F3" stroke="#3B4657" stroke-width="2.5"/>
  <text x="722" y="45" fill="#24303D">Actor</text>

  <rect x="700" y="54" width="14" height="14" rx="3" fill="#F1ECFB" stroke="#6B46C1" stroke-width="2.5"/>
  <text x="722" y="65" fill="#452F82">Ingress (DNS / CDN)</text>

  <rect x="700" y="74" width="14" height="14" rx="3" fill="#FBF1DC" stroke="#B7791F" stroke-width="2.5"/>
  <text x="722" y="85" fill="#7A5010">Routing (load balancer)</text>

  <rect x="880" y="34" width="14" height="14" rx="3" fill="#FCEBE0" stroke="#C2410C" stroke-width="2.5"/>
  <text x="902" y="45" fill="#8A2F09">Compute</text>

  <rect x="880" y="54" width="14" height="14" rx="3" fill="#E7F6EC" stroke="#15803D" stroke-width="2.5"/>
  <text x="902" y="65" fill="#0F5C2E">Storage</text>

  <rect x="880" y="74" width="14" height="14" rx="3" fill="#E7EDFC" stroke="#1D4ED8" stroke-width="2.5"/>
  <text x="902" y="85" fill="#15359E">Database</text>

  <text x="700" y="104" font-size="10" fill="#4B5563">Arrow color = destination component's domain.</text>
  <text x="700" y="118" font-size="10" fill="#4B5563">Dashed = replication (real meaning, not decoration).</text>
</g>

</svg>
