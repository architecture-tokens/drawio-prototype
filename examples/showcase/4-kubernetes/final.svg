<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1806 528" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
<!--
Semantic palette (diagram-rules.md C1). Every colored element below draws from
this palette; arrows are colored by the domain they lead INTO (C2).

  ACTOR      border #6B3FA0  bg #F3E8FC  text #3E1A63
             External test actor, outside the Kubernetes cluster.
  WORKLOAD   border #1D4ED8  bg #EAF1FE  text #1E3A8A
             A Kubernetes ReplicationController (k8s:workload.replication-controller), a
             pod-managing compute workload.
  NETWORK    border #0F766E  bg #E6FBF8  text #0B4F49
             A Kubernetes Service (k8s:network.service), a routing object in front of a workload.
  STRUCTURE (neutral, C3, carries no domain meaning, two tints for two nesting levels)
    platform   border #C7CDD6  bg #F5F6F8  text #6B7280
               Outer platform boundary (Google Cloud Platform).
    namespace  border #BFDCEF  bg #EAF3FB  text #5B7186
               Kubernetes namespace boundary (k8s:topology.namespace), nested one level inside platform.
  CHROME     bg #2B3440  text #FFFFFF
             Title bar: UI chrome, not diagram data (C3 fallback, no semantic applies).

Arrow color = destination-node semantic (C2): an arrow entering a WORKLOAD node is
WORKLOAD-blue; an arrow entering a NETWORK node is NETWORK-teal. This produces the
alternating blue/teal chain that mirrors the real compute-then-routing hops.
-->
<rect x="0" y="0" width="1806" height="528" fill="#FFFFFF"/>
<defs>
  <marker id="arrow-workload" markerWidth="13" markerHeight="13" refX="10" refY="5"
          viewBox="0 0 10 10" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 Z" fill="#1D4ED8"/>
  </marker>
  <marker id="arrow-network" markerWidth="13" markerHeight="13" refX="10" refY="5"
          viewBox="0 0 10 10" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 Z" fill="#0F766E"/>
  </marker>
</defs>
