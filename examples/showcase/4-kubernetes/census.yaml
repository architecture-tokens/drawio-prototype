# Source census (prototype v0). One record per SOURCE element (source.xml
# mxCell) -- see examples/showcase/1-cloud-web-app/census.yaml for the
# mechanics this mirrors (tools/rules-lint.mjs --census enforces record
# count == vertex_count + edge_count, target_ids resolution, and a reason
# on every drop). This source has no drops and no standalone tokens: every
# vertex is either a first-class model component or a view-only visual
# container, and every edge is a first-class relationship.
kind: census
model: model.yaml
source: source.xml
records:
