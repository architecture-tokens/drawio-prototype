<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.5 -0.5 1045 452" width="1045" height="452" font-family="Helvetica, Arial, sans-serif">
<!--
  REPRODUCE MODE. Geometry, grouping, labels, shadows, icon placement and
  palette are transcribed from source.xml and its native draw.io export.
  The only visual correction is normative connector treatment: all nine
  relationships are orthogonal and every bend has a uniform 5px radius.

  Semantic palette (C1, exact source colors): platform #F6F6F6; namespaces
  #E1F5FE; tester #F3E5F5; cards #FFFFFF / #DDDDDD; shadow/text #000000;
  platform text #717171; secondary text #9E9E9E / #999999; laptop #757575;
  title #4DA1F5; connectors #4284F3. Source-embedded Google artwork uses
  GKE #AECBFA/#669DF6/#4285F4 and cloud logo #E2E2E2/#FFCF48/#DC473A/#528FF5.
-->
<defs>
  <marker id="arrow-gcp" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4284F3"/></marker>
  <!-- Official Google Cloud glyphs are transcribed from source.xml's embedded mxgraph.gcp2 artwork. -->
  <symbol id="icon-gcp-kubernetes-engine" viewBox="0 0 87.293 100.088">
    <path fill="#AECBFA" d="M43.751 0 0 25.465v2.588l.01 46.92 43.752 25.115 43.531-25.121V25.473zm2.438 11.853 32.103 18.782V69.77L43.739 89.705 9 69.762V30.641l32.19-18.736v14.154L24.503 36.153l19.172 11.502 18.886-11.554-16.372-10.024z"/>
    <path fill="#669DF6" d="M22.025 40.496l.166 19.143-13.247 7.33v2.742l2.637 1.514 12.648-6.999L41.19 74.828V51.993z"/>
    <path fill="#4285F4" d="M65.344 40.26 46.189 51.979v22.847l16.899-10.576 12.539 6.974 2.609-1.505v-2.765l-12.784-7.112z"/>
  </symbol>
  <symbol id="icon-gcp-laptop" viewBox="0 0 50 34">
    <path d="M8.46 0C6.08 0 4.17 1.9 4.17 4.26v20.43c0 2.37 1.91 4.28 4.29 4.28H0V33h50v-4.03h-8.55c2.38 0 4.29-1.91 4.29-4.28V4.26C45.74 1.9 43.83 0 41.45 0z" fill="#757575"/>
    <path d="M8.14 4.03h33.61v20.93H8.14z" fill="#FFFFFF"/>
  </symbol>
  <symbol id="icon-gcp-cloud-logo" viewBox="0 0 23 20">
    <path d="M7.97 16.03 2.17 6.04.31 9.23c-.25.46-.31 1.07.01 1.55l4.84 8.33c.24.52.72.89 1.51.89h6.04l2.31-3.97z" fill="#FFCF48"/>
    <path d="M16.54 20h-3.83l5.82-9.98L15.03 4h4.63l3.03 5.23c.29.5.31 1.01.01 1.56l-4.79 8.22c-.3.56-.67.99-1.37.99z" fill="#DC473A"/>
    <path d="M16.5.02c.57 0 1.04.33 1.31.83L19.66 4H7.99L4.48 10.01 2.17 6.04 5.12.95C5.48.36 5.85 0 6.84.02z" fill="#528FF5"/>
    <path d="M7.97 16.03 4.48 10.01 7.99 4h7.04l3.5 6.02-3.51 6.01z" fill="#E2E2E2"/>
  </symbol>
</defs>

<g>
